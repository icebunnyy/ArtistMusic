{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - ArtistMusic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-['Inter'] px-4 py-12">

    <div class="max-w-xl w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-8 backdrop-blur-xl shadow-2xl">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-indigo-500"></span>
                {{ titulo }}
            </h1>
            <a href="{% url 'inicio_artistas' %}" class="text-xs text-slate-400 hover:text-white transition-colors">Cancelar</a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            
            {% for field in form %}
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <span class="text-rose-400 text-[10px] block mt-1">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="pt-4 flex gap-3">
                <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/30">
                    Guardar Cambios
                </button>
                <a href="{% url 'inicio_artistas' %}" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-5 py-3 rounded-xl transition-all border border-slate-700">
                    Volver
                </a>
            </div>
        </form>
    </div>

</body>
</html>
