{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar Código - ArtistMusic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-['Inter'] px-4 py-12">

    <div class="max-w-md w-full bg-slate-900/80 border border-slate-800 rounded-3xl p-8 backdrop-blur-xl shadow-2xl">
        <div class="text-center mb-8">
            <span class="bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 text-white p-3 rounded-2xl font-black text-xl shadow-lg inline-block mb-3">🔑</span>
            <h1 class="text-2xl font-bold text-white">Verificar Código</h1>
            <p class="text-xs text-slate-400 mt-1">Ingresa el código de 6 dígitos que enviamos a tu correo</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 {% if message.tags == 'success' %}bg-emerald-500/10 text-emerald-400 border-emerald-500/20{% else %}bg-rose-500/10 text-rose-400 border-rose-500/20{% endif %} border text-xs rounded-xl mb-4">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 text-center">{{ form.codigo.label }}</label>
                {{ form.codigo }}
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/30 mt-2">
                Validar Código
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            ¿No recibiste el código? <a href="{% url 'recuperar_password' %}" class="text-indigo-400 font-semibold hover:underline">Reenviar</a>
        </div>
    </div>

</body>
</html>
