{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ArtistMusic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-['Inter'] px-4 py-12">

    <div class="max-w-md w-full bg-slate-900/80 border border-slate-800 rounded-3xl p-8 backdrop-blur-xl shadow-2xl">
        <div class="text-center mb-8">
            <span class="bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 text-white p-3 rounded-2xl font-black text-xl shadow-lg inline-block mb-3">AM</span>
            <h1 class="text-2xl font-bold text-white">Iniciar Sesión</h1>
            <p class="text-xs text-slate-400 mt-1">Ingresa a tu cuenta de ArtistMusic</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 text-xs p-3 rounded-xl {% if message.tags == 'error' %}bg-rose-500/10 text-rose-400 border border-rose-500/20{% else %}bg-indigo-500/10 text-indigo-400 border border-indigo-500/20{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nombre de Usuario</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 text-slate-100 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500" placeholder="usuario123">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-semibold text-slate-300">Contraseña</label>
                    <a href="{% url 'recuperar_password' %}" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors font-medium">¿Olvidaste tu contraseña?</a>
                </div>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 text-slate-100 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/30">
                Entrar
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            ¿No tienes cuenta? <a href="{% url 'registro' %}" class="text-indigo-400 font-semibold hover:underline">Regístrate aquí</a>
        </div>
    </div>

</body>
</html>
